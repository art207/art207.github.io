<header class="site-header">
  <div class="wrap">
    <a class="site-mark" href="/"><span class="dot"></span>anoop<span class="bracket">.</span>log</a>
    <nav class="site-nav">
      {% for item in site.data.nav %}
      <a href="{{ item.url }}"{% if item.url == page.url or item.url == page.nav_section %} aria-current="page"{% endif %}>{{ item.label }}</a>
      {% endfor %}
    </nav>
    {% unless page.admin %}
    <span class="sync-status"><span class="sync-dot"></span><span id="sync-status-text">syncing…</span></span>
    {% endunless %}
    <button class="theme-toggle" aria-label="Toggle dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    {% if page.admin_link == "signout" %}
    <a class="auth-link" href="#" id="logout-link">Sign out</a>
    {% endif %}
    <button class="nav-toggle" aria-label="Toggle navigation">menu</button>
  </div>
</header>
